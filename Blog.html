
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anirban - Blog</title>

    <!-- Connect external CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Blog Page Styles -->
    <style>
        .blog-section {
            background: #0b1020;
            color: #eef3ff;
            padding: 65px 0 55px;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 55vh;
        }

        .blog-container {
            width: 90%;
            max-width: 1210px;
            margin: 0 auto;
        }

        .blog-heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .blog-eyebrow {
            color: #70a7ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .blog-heading h1 {
            color: #ffffff;
            font-size: clamp(30px, 4vw, 40px);
            line-height: 1.2;
            margin: 0 0 12px;
        }

        .blog-heading p {
            color: #9dbef7;
            font-size: 16px;
            line-height: 1.6;
            max-width: 680px;
            margin: 0 auto;
        }

        .blog-content {
            max-width: 850px;
            margin: 0 auto;
            padding: 30px;
            background: #121a2e;
            border: 1px solid #293751;
            border-radius: 18px;
            text-align: center;
            box-sizing: border-box;
        }

        .blog-content p {
            color: #c5d7ff;
            font-size: 17px;
            line-height: 1.8;
            margin: 0;
        }

        .blog-portfolio {
            text-align: center;
            padding: 35px 0 45px;
            background: #0b1020;
            font-family: Arial, Helvetica, sans-serif;
        }

        .blog-portfolio a {
            display: inline-block;
            padding: 12px 24px;
            background: #1b2b4b;
            border: 1px solid #30466b;
            border-radius: 8px;
            color: #c5d7ff;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            text-decoration: none;
            transition: background 0.2s ease,
                        border-color 0.2s ease,
                        color 0.2s ease;
        }

        .blog-portfolio a:hover {
            background: #20365e;
            border-color: #70a7ff;
            color: #ffffff;
        }

        @media (max-width: 700px) {
            .blog-section {
                padding: 48px 0 40px;
            }

            .blog-content {
                padding: 22px 18px;
            }

            .blog-portfolio {
                padding: 25px 0 35px;
            }
        }
    </style>

</head>

<body>

    <!-- ==============================
         HEADER / NAVIGATION
         ============================== -->

    <header>

        <div class="container nav">

            <div class="logo">
                <a href="index.html">Anirban Chowdhury</a>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html#projects">MyProjects</a>
                </li>

                <li>
                    <a href="older-projects.html">Older Projects</a>
                </li>

                <li>
                    <a href="Blog.html" aria-current="page">Blog</a>
                </li>

                <li>
                    <a href="About%20Me.html">About Me</a>
                </li>

                <li>
                    <a href="index.html#contact">Contact</a>
                </li>

            </ul>

        </div>

    </header>


    <!-- ==============================
         BLOG SECTION
         ============================== -->

    <section class="blog-section">

        <div class="blog-container">

            <div class="blog-heading">

                <p class="blog-eyebrow">BLOG</p>

                <h1>My Blog</h1>

                <p>
                    Thoughts, updates and insights from my ongoing
                    learning and analytical work.
                </p>

            </div>

            <div class="blog-content">

                <p>
                    Blog articles will posted whenever some specific updates are there.
                </p>

            </div>

        </div>

    </section>


    <!-- ==============================
         GO TO PORTFOLIO
         ============================== -->

    <section class="blog-portfolio">

        <div class="blog-container">

            <a href="index.html">Go To Portfolio</a>

        </div>

    </section>


    <!-- ==============================
         FOOTER
         ============================== -->

    <footer>

        <div class="container">

            <p>
                © Anirban Chowdhury |
                <a href="#top">Back To Top</a>
            </p>

        </div>

    </footer>


    <!-- Connect JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
